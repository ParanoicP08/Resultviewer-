name: Update Results

on:
  schedule:
    # Runs every Monday at 6 AM IST (12:30 AM UTC)
    - cron: '30 0 * * 1'
  workflow_dispatch: # lets you trigger it manually from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run scraper + parser
        run: python scripts/scrape_and_parse.py

      - name: Inject new data into HTML
        run: python scripts/inject_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/students.json
          git diff --cached --quiet || git commit -m "Auto-update: results refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          
